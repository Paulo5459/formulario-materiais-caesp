<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Materiais CAESP/2026</title>
  <style>
    :root {
      --bg-from: #eaf2ff;
      --bg-to: #cfe1ff;
      --card: #ffffff;
      --text: #0f1f3d;
      --muted: #56678a;
      --border: #cddaf0;
      --field: #f5f8ff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --head-from: #1e3a8a;
      --head-to: #2563eb;
      --ring: rgb(37 99 235 / 0.22);
      --tone-1: #0284c7;
      --tone-2: #4f46e5;
      --tone-3: #0891b2;
      --tone-4: #b45309;
      --shadow: 0 2px 4px rgb(15 31 61 / 0.06), 0 20px 45px rgb(30 58 138 / 0.18);
      --ok-bg: #e3f6ec;
      --ok-text: #14532d;
      --err-bg: #fdebec;
      --err-text: #7f1d1d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-from: #07101f;
        --bg-to: #0d1f3f;
        --card: #0f1c33;
        --text: #e6eefc;
        --muted: #9db0d3;
        --border: #23395e;
        --field: #0a1528;
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --head-from: #172c66;
        --head-to: #1d4ed8;
        --ring: rgb(96 165 250 / 0.3);
        --tone-1: #38bdf8;
        --tone-2: #818cf8;
        --tone-3: #22d3ee;
        --tone-4: #fbbf24;
        --shadow: 0 2px 4px rgb(0 0 0 / 0.4), 0 20px 45px rgb(0 0 0 / 0.45);
        --ok-bg: #11301f;
        --ok-text: #b7e4c7;
        --err-bg: #3a1719;
        --err-text: #f5b5b8;
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(16px, 4vw, 48px) 16px;
      background: linear-gradient(160deg, var(--bg-from), var(--bg-to)) fixed;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    header {
      position: relative;
      padding: 32px 28px 28px;
      color: #fff;
      background: linear-gradient(135deg, var(--head-from), var(--head-to));
      border-bottom: 5px solid;
      border-image: linear-gradient(90deg, var(--tone-1), var(--tone-2), var(--tone-3)) 1;
      overflow: hidden;
    }
    header::before,
    header::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgb(255 255 255 / 0.09);
      pointer-events: none;
    }
    header::before { width: 190px; height: 190px; top: -80px; right: -50px; }
    header::after  { width: 120px; height: 120px; bottom: -70px; right: 90px; }

    h1 {
      position: relative;
      margin: 0 0 6px;
      font-size: clamp(1.35rem, 1.1rem + 1.2vw, 1.7rem);
      font-weight: 750;
      line-height: 1.2;
      text-wrap: balance;
    }
    .sub {
      position: relative;
      margin: 0;
      font-size: 0.95rem;
      color: rgb(255 255 255 / 0.88);
    }

    form {
      position: relative;
      isolation: isolate;
      padding: 28px;
    }
    /* Logo da SSP como marca d'água no fundo do formulário. */
    form::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: url("assets/logo-ssp.png") center / min(85%, 400px) no-repeat;
      opacity: 0.3;
      pointer-events: none;
    }
    @media (prefers-color-scheme: dark) {
      form::before { opacity: 0.4; }
    }

    .field { --tone: var(--primary); margin-bottom: 20px; }
    .grid .field:nth-child(1) { --tone: var(--tone-1); }
    .grid .field:nth-child(2) { --tone: var(--tone-2); }
    .grid .field:nth-child(3) { --tone: var(--tone-3); }
    .grid .field:nth-child(4) { --tone: var(--tone-4); }

    label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }
    label::before {
      content: "";
      flex: none;
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--tone);
    }

    .grid {
      display: grid;
      gap: 0 16px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr));
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: color-mix(in srgb, var(--tone) 7%, var(--field));
      border: 1.5px solid color-mix(in srgb, var(--tone) 30%, var(--border));
      border-radius: 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    input::placeholder { color: var(--muted); opacity: 0.7; }
    input:hover { border-color: color-mix(in srgb, var(--tone) 60%, var(--border)); }
    input:focus {
      outline: none;
      background: var(--card);
      border-color: var(--tone);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--tone) 25%, transparent);
    }

    button {
      width: 100%;
      margin-top: 4px;
      padding: 14px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 0;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgb(37 99 235 / 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 12px 26px rgb(37 99 235 / 0.42);
    }
    button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); }
    button:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; }

    #msg {
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    #msg.ok  { background: var(--ok-bg);  color: var(--ok-text); }
    #msg.err { background: var(--err-bg); color: var(--err-text); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    @media (max-width: 420px) {
      header { padding: 26px 20px 22px; }
      form { padding: 22px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Formulário de Materiais CAESP/2026</h1>
      <p class="sub">Preencha o levantamento de materiais da sua instituição. Use 0 quando não precisar do item.</p>
    </header>

    <form id="form" novalidate>
      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="instituicao">Instituição</label>
        <input type="text" id="instituicao" autocomplete="organization" required>
      </div>

      <div class="grid">
        <div class="field">
          <label for="moedas">Moedas</label>
          <input type="number" id="moedas" min="0" step="1" inputmode="numeric" placeholder="0" required>
        </div>

        <div class="field">
          <label for="breves">Brevês metálicos</label>
          <input type="number" id="breves" min="0" step="1" inputmode="numeric" placeholder="0" required>
        </div>

        <div class="field">
          <label for="brevesEmborrachados">Brevês emborrachados</label>
          <input type="number" id="brevesEmborrachados" min="0" step="1" inputmode="numeric" placeholder="0" required>
        </div>

        <div class="field">
          <label for="totens">Totens</label>
          <input type="number" id="totens" min="0" step="1" inputmode="numeric" placeholder="0" required>
        </div>
      </div>

      <button type="submit" id="enviar">Enviar</button>
      <div id="msg" role="status" aria-live="polite" hidden></div>
    </form>
  </main>

  <script>
    // ---- CONFIGURAÇÃO ----
    // URL do Web App do Apps Script (termina em /exec).
    var ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbzaLvEhsg3Ynw-FFfy_Bo_6eDRnJa6MShndzakygUVuBT_Qzql0jl2_3-RVzzDt-ct8/exec';
    // ---- FIM DA CONFIGURAÇÃO ----

    var FIELDS = ['nome', 'instituicao', 'moedas', 'breves', 'brevesEmborrachados', 'totens'];

    var form = document.getElementById('form');
    var btn = document.getElementById('enviar');
    var msg = document.getElementById('msg');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = type;
      msg.hidden = false;
    }

    function isNonNegativeInt(value) {
      return /^\d+$/.test(value.trim());
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      msg.hidden = true;

      var v = {};
      FIELDS.forEach(function (k) { v[k] = document.getElementById(k).value; });

      if (!v.nome.trim() || !v.instituicao.trim()) {
        showMessage('Preencha o nome completo e a instituição.', 'err');
        return;
      }
      if (!isNonNegativeInt(v.moedas) || !isNonNegativeInt(v.breves) || !isNonNegativeInt(v.brevesEmborrachados) || !isNonNegativeInt(v.totens)) {
        showMessage('As quantidades devem ser números inteiros, iguais ou maiores que 0.', 'err');
        return;
      }
      if (ENDPOINT_URL.indexOf('https://') !== 0) {
        showMessage('Formulário ainda não configurado: falta a URL do Apps Script.', 'err');
        return;
      }

      var payload = {
        nomeCompleto: v.nome.trim(),
        instituicao: v.instituicao.trim(),
        quantidadeMoeda: Number(v.moedas),
        quantidadeBreveMetalico: Number(v.breves),
        quantidadeBreveEmborrachado: Number(v.brevesEmborrachados),
        quantidadeTotem: Number(v.totens)
      };

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      // text/plain evita o preflight CORS, que o Apps Script não responde.
      fetch(ENDPOINT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.status !== 'ok') {
            showMessage('Não foi possível enviar: ' + (data.message || 'erro desconhecido.'), 'err');
            return;
          }
          form.reset();
          showMessage('Enviado com sucesso. Obrigado!', 'ok');
        })
        .catch(function () {
          showMessage('Falha de conexão. Verifique sua internet e tente novamente.', 'err');
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = 'Enviar';
        });
    });
  </script>
</body>
</html>
